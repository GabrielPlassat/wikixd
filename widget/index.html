<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dernières modifications – Wiki XD</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --accent:#0f766e; --accent-soft:#ccfbf1; --plus:#15803d; --minus:#b91c1c;
    --new:#7c3aed; --new-soft:#ede9fe;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111827; --fg:#e5e7eb; --muted:#9ca3af; --line:#374151;
      --accent:#2dd4bf; --accent-soft:#134e4a; --plus:#4ade80; --minus:#f87171;
      --new:#c4b5fd; --new-soft:#3b0764; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .w{max-width:640px;margin:0 auto;padding:14px 16px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  h1{font-size:16px;margin:0;flex:1}
  h1 a{color:inherit;text-decoration:none}
  .count{font-size:12px;color:var(--muted);font-weight:normal}
  input[type=search]{flex:1 1 160px;padding:6px 9px;border:1px solid var(--line);
    border-radius:6px;background:transparent;color:inherit;font:inherit}
  button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;
    background:transparent;color:inherit;cursor:pointer;font:inherit}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .day{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:14px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
  ul{list-style:none;margin:0;padding:0}
  li{padding:7px 0;border-bottom:1px dashed var(--line)}
  li:last-child{border-bottom:none}
  .top{display:flex;align-items:baseline;gap:8px}
  .title{font-weight:600;color:var(--accent);text-decoration:none;flex:1;min-width:0;
    overflow-wrap:anywhere}
  .title:hover{text-decoration:underline}
  .time{font-size:12px;color:var(--muted);white-space:nowrap}
  .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11px;padding:0 6px;border-radius:9px;background:var(--new-soft);color:var(--new);font-weight:600}
  .plus{color:var(--plus);font-weight:600}.minus{color:var(--minus);font-weight:600}
  .cmt{font-style:italic;overflow-wrap:anywhere}
  .diff{font-size:12px}
  .diff a{color:var(--muted)}
  .state{padding:20px 0;color:var(--muted);text-align:center}
  .err{color:var(--minus)}
  footer{margin-top:12px;font-size:11px;color:var(--muted);text-align:right}
</style>
</head>
<body>
<div class="w">
  <header>
    <h1><a href="https://wikixd.fabmob.io/wiki/Spécial:Modifications_récentes" target="_blank" rel="noopener">
      Dernières modifications du wiki XD</a> <span class="count" id="count"></span></h1>
    <input type="search" id="q" placeholder="Filtrer (page, auteur…)">
    <button id="refresh" title="Actualiser">↻</button>
  </header>
  <div id="list"><div class="state">Chargement…</div></div>
  <footer id="foot"></footer>
</div>

<script>
/* ===== Réglages ===== */
const WIKI  = "https://wikixd.fabmob.io";
const DAYS  = 7;     // période couverte
const LIMIT = 50;    // nombre max de modifications
const REFRESH_MIN = 10; // actualisation automatique (minutes), 0 = désactivé

const API = WIKI + "/api.php";
const FEED = `${API}?hidebots=1&translations=filter&urlversion=2&days=${DAYS}&limit=${LIMIT}&action=feedrecentchanges&feedformat=atom`;

let items = [];

/* --- Source 1 : API JSON MediaWiki (autorise le navigateur via origin=*) --- */
async function fromJsonApi(){
  const since = new Date(Date.now() - DAYS*864e5).toISOString();
  const p = new URLSearchParams({
    action:"query", list:"recentchanges", format:"json", formatversion:"2", origin:"*",
    rcprop:"title|timestamp|user|comment|sizes|ids|flags", rcshow:"!bot",
    rctype:"edit|new", rclimit:String(LIMIT), rcend:since
  });
  const r = await fetch(`${API}?${p}`);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const d = await r.json();
  if(!d.query) throw new Error("réponse inattendue");
  return d.query.recentchanges.map(c => ({
    title: c.title,
    url: `${WIKI}/index.php?title=${encodeURIComponent(c.title)}`,
    diff: c.type==="new" ? null : `${WIKI}/index.php?title=${encodeURIComponent(c.title)}&diff=${c.revid}&oldid=${c.old_revid}`,
    date: new Date(c.timestamp),
    user: c.user || "",
    comment: c.comment || "",
    delta: (c.newlen ?? 0) - (c.oldlen ?? 0),
    isNew: c.type==="new"
  }));
}

/* --- Source 2 : le flux Atom (direct, puis via un relais si le wiki bloque) --- */
function parseAtom(xml){
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const entries = [...doc.getElementsByTagName("entry")];
  if(!entries.length && doc.getElementsByTagName("parsererror").length) throw new Error("flux illisible");
  return entries.map(e => {
    const get = t => (e.getElementsByTagName(t)[0]?.textContent || "").trim();
    const link = e.getElementsByTagName("link")[0]?.getAttribute("href") || "";
    const summaryHtml = get("summary");
    // Le résumé MediaWiki contient le commentaire dans un <p> en tête
    const tmp = document.createElement("div"); tmp.innerHTML = summaryHtml;
    const comment = (tmp.querySelector("p")?.textContent || "").trim();
    const title = get("title");
    return {
      title, url: `${WIKI}/index.php?title=${encodeURIComponent(title)}`,
      diff: /diff=/.test(link) ? link : null,
      date: new Date(get("updated")), user: get("name"),
      comment, delta: null, isNew: !/diff=/.test(link)
    };
  });
}
async function fromAtom(){
  const r = await fetch(FEED + "&origin=*");
  if(!r.ok) throw new Error("HTTP "+r.status);
  return parseAtom(await r.text());
}
async function fromAtomProxy(){
  const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(FEED));
  if(!r.ok) throw new Error("HTTP "+r.status);
  return parseAtom(await r.text());
}

/* --- Affichage --- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayFmt  = new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const timeFmt = new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit"});
function dayLabel(d){
  const t = new Date(); t.setHours(0,0,0,0);
  const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((t - x)/864e5);
  return diff===0 ? "Aujourd'hui" : diff===1 ? "Hier" : dayFmt.format(d);
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = document.getElementById("list");
  const shown = items.filter(i => !q || (i.title+" "+i.user+" "+i.comment).toLowerCase().includes(q));
  document.getElementById("count").textContent = `· ${shown.length} sur ${DAYS} jours`;
  if(!shown.length){ list.innerHTML = `<div class="state">Aucune modification${q?" pour ce filtre":""}.</div>`; return; }

  let html = "", cur = "";
  for(const i of shown){
    const lbl = dayLabel(i.date);
    if(lbl !== cur){ if(cur) html += "</ul>"; html += `<div class="day">${esc(lbl)}</div><ul>`; cur = lbl; }
    const delta = i.delta==null ? "" :
      `<span class="${i.delta>=0?"plus":"minus"}">${i.delta>0?"+":""}${i.delta.toLocaleString("fr-FR")}</span>`;
    html += `<li>
      <div class="top">
        <a class="title" href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>
        <span class="time">${timeFmt.format(i.date)}</span>
      </div>
      <div class="meta">
        ${i.isNew ? '<span class="badge">nouvelle page</span>' : ""}
        ${i.user ? `<span>par ${esc(i.user)}</span>` : ""}
        ${delta}
        ${i.diff ? `<span class="diff"><a href="${esc(i.diff)}" target="_blank" rel="noopener">voir le diff</a></span>` : ""}
      </div>
      ${i.comment ? `<div class="meta cmt">${esc(i.comment)}</div>` : ""}
    </li>`;
  }
  list.innerHTML = html + "</ul>";
}

async function load(){
  const list = document.getElementById("list");
  if(!items.length) list.innerHTML = '<div class="state">Chargement…</div>';
  const sources = [fromJsonApi, fromAtom, fromAtomProxy];
  const errors = [];
  for(const src of sources){
    try{
      items = (await src()).sort((a,b)=>b.date-a.date);
      render();
      document.getElementById("foot").textContent = "Mis à jour à " + timeFmt.format(new Date());
      return;
    }catch(e){ errors.push(src.name+" : "+e.message); }
  }
  list.innerHTML = `<div class="state err">Impossible de charger les modifications.<br>
    <a href="${esc(FEED)}" target="_blank" rel="noopener">Ouvrir le flux directement</a></div>`;
  console.warn(errors);
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", load);
load();
if(REFRESH_MIN>0) setInterval(load, REFRESH_MIN*60e3);
</script>
</body>
</html>
