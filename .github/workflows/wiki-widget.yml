name: Widget wiki XD – mise à jour des données

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 minutes
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    paths:
      - "scripts/fetch_recent_changes.py"
      - ".github/workflows/wiki-widget.yml"

permissions:
  contents: write

concurrency:
  group: wiki-widget
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_recent_changes.py
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add widget/data.json
          if git diff --cached --quiet; then echo "Rien de neuf"; exit 0; fi
          git commit -m "Widget : mise à jour des modifications du wiki"
          git pull --rebase origin main
          git push
